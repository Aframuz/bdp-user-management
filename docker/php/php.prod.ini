expose_php=Off
memory_limit=256M
max_execution_time=60
post_max_size=16M
upload_max_filesize=16M

; Los errores van al log del contenedor (stderr) y nunca al cuerpo de la
; respuesta: APP_DEBUG=false ya lo cubre en Laravel, esto lo cubre en PHP.
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
