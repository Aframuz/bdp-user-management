name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Etiqueta ya publicada a desplegar (vacío = construir el commit actual). Sirve para hacer rollback."
        required: false
        type: string

# Nunca dos despliegues simultáneos sobre el mismo servidor; y a diferencia de
# CI, aquí no se cancela el que está en curso: podría quedar a medio camino.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # 1. La misma suite de CI, reutilizada (no una copia)
  # ---------------------------------------------------------------------
  tests:
    name: Suite de CI
    if: ${{ github.event.inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------
  # 2. Construir y publicar las imágenes en GHCR
  # ---------------------------------------------------------------------
  build:
    name: Construir y publicar
    runs-on: ubuntu-latest
    needs: [tests]
    # `always()` para que un rollback (que salta los tests) igual llegue aquí,
    # pero sin dejar pasar un fallo real de la suite.
    if: ${{ always() && !failure() && !cancelled() }}
    timeout-minutes: 30
    outputs:
      image_repository: ${{ steps.meta.outputs.repository }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y etiqueta de la imagen
        id: meta
        # GHCR solo acepta minúsculas y el owner de este repo tiene mayúsculas.
        run: |
          repository="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.event.inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_SHA}"
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Omitir la construcción en un rollback
        id: skip
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "La etiqueta ya está publicada; se despliega tal cual."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.skip.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar `app` (php-fpm)
        if: steps.skip.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repository }}/app:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repository }}/app:latest
          cache-from: type=gha,scope=prod-app
          cache-to: type=gha,mode=max,scope=prod-app

      - name: Construir y publicar `web` (Caddy)
        if: steps.skip.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repository }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repository }}/web:latest
          cache-from: type=gha,scope=prod-web
          cache-to: type=gha,mode=max,scope=prod-web

  # ---------------------------------------------------------------------
  # 3. Desplegar en la instancia de Oracle Cloud
  # ---------------------------------------------------------------------
  deploy:
    name: Desplegar en OCI
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    # Configurar aprobación manual en Settings > Environments > production
    # si se quiere una compuerta humana antes de tocar el servidor.
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la configuración del despliegue
        # Un secreto sin definir se interpola como cadena vacía, así que el
        # fallo aparece varias líneas más abajo disfrazado de otra cosa: `scp`
        # termina conectándose a `@:` y muere con «Could not resolve hostname».
        # Esta comprobación lo nombra directamente.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="${missing} ${name} (secreto)"
          done
          for name in APP_DOMAIN DEPLOY_PATH; do
            [ -n "${!name}" ] || missing="${missing} ${name} (variable)"
          done
          if [ -n "$missing" ]; then
            echo "::error::Falta configurar en Settings > Secrets and variables > Actions:${missing}"
            echo "Ver docs/ci-cd.md, Paso 7. Secrets y variables del repositorio."
            echo "Si se definieron con alcance de entorno, el entorno debe llamarse"
            echo "exactamente 'production': es el que declara este job."
            exit 1
          fi
          echo "Configuración completa. Desplegando ${IMAGE_REPOSITORY} (${IMAGE_TAG}) en ${DEPLOY_PATH}"

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # La huella del host se fija como secreto en lugar de usar
          # StrictHostKeyChecking=no: sin esto el despliegue acepta cualquier
          # servidor que responda en esa IP.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copiar el compose de producción
        # El servidor no clona el repositorio: recibe solo este archivo, así
        # que su stack siempre coincide con lo que está versionado aquí.
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ vars.DEPLOY_SSH_PORT || 22 }}" \
            compose.prod.yaml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/compose.prod.yaml"

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ vars.DEPLOY_SSH_PORT || 22 }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY}" \
            IMAGE_TAG="${IMAGE_TAG}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
            APP_DOMAIN="${{ vars.APP_DOMAIN }}" \
            GHCR_USER="${{ github.actor }}" \
            GHCR_TOKEN="${{ secrets.GHCR_READ_TOKEN }}" \
            'bash -s' < deploy/remote-deploy.sh

      - name: Verificar el sitio publicado
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://${{ vars.APP_DOMAIN }}/up" > /dev/null; then
              echo "https://${{ vars.APP_DOMAIN }}/up responde correctamente."
              exit 0
            fi
            echo "Intento $attempt sin respuesta; reintentando en 10s..."
            sleep 10
          done
          echo "El sitio no respondió tras el despliegue."
          # Un error de TLS aquí casi siempre significa que Caddy no consiguió
          # el certificado y está sirviendo el suyo interno. Mostrar el
          # certificado real distingue eso de una caída de la aplicación.
          echo "--- Certificado que sirve ${{ vars.APP_DOMAIN }}:443 ---"
          echo | openssl s_client -connect "${{ vars.APP_DOMAIN }}:443" \
                   -servername "${{ vars.APP_DOMAIN }}" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName 2>/dev/null \
            || echo "No se pudo negociar TLS con el servidor."
          echo "--- Respuesta ignorando la validación del certificado ---"
          curl -ksS --max-time 10 -o /dev/null -w 'HTTP %{http_code}\n' \
            "https://${{ vars.APP_DOMAIN }}/up" || true
          echo
          echo "Si el certificado es de OTRO dominio, Apache no tiene vhost para"
          echo "este y responde con el del sitio por defecto: revisar a2ensite y"
          echo "certbot (Paso 7 de docs/ci-cd.md). Si la respuesta es 502, el"
          echo "stack no está escuchando en 127.0.0.1:8080."
          exit 1
